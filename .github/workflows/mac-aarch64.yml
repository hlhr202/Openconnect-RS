name: Mac ARM64 Build

on:
  workflow_dispatch:
  push:
    tags:
      - v*
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Install Package
        uses: ConorMacBride/install-package@v1.1.0
        with:
          brew: libxml2 zlib openssl pkg-config automake libtool gettext zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: 12

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          cache: true

      - name: Build
        run: |
          cd ./crates/openconnect-gui
          pnpm install
          pnpm tauri build

      - name: Build CLI
        run: |
          cargo build --release -p openconnect-cli

      - name: Upload
        uses: actions/upload-artifact@v4.3.1
        with:
          name: openconnect-mac-aarch64
          path: |
            ./target/release/bundle/
            ./target/release/openconnect-cli
