name: Mac ARM64 Prebuilt OpenConnect

on:
  workflow_dispatch:
  push:
    paths:
      - "crates/openconnect-sys"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Install Dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install libxml2 zlib openssl@3 lz4 xz pkg-config automake autoconf libtool gettext zip

      - name: "🚧 Build TOOL"
        run: |
          git clone --branch v9.12 https://gitlab.com/openconnect/openconnect.git
          cd openconnect
          curl -O https://gitlab.com/openconnect/vpnc-scripts/raw/master/vpnc-script
          ./autogen.sh
          ./configure --enable-shared --enable-static \
            --with-openssl \
            --without-gssapi \
            --without-libproxy \
            --without-stoken \
            --without-libpcsclite \
            --without-libpskc \
            --without-gnutls \
            --with-vpnc-script=./vpnc-script
          make clean
          make
          rm -rf .git
          cd ../
          zip -r openconnect.zip openconnect

      - name: "Upload"
        uses: actions/upload-artifact@v4.3.1
        with:
          name: prebuilt-openconnect-aarch64-apple-darwin
          path: openconnect.zip
