name: Linux x64 Build

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main", "develop"]

# Release profile only for tags (incl. release.yml via workflow_call), `main`, and
# PRs targeting `main`. Everything on `develop` uses a fast debug build instead.
env:
  BUILD_PROFILE: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.base_ref == 'main') && 'release' || 'debug' }}
  TAURI_PROFILE_FLAG: ${{ !(startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.base_ref == 'main') && '--debug' || '' }}
  CARGO_PROFILE_FLAG: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.base_ref == 'main') && '--release' || '' }}
  # Skip debuginfo in debug builds: much faster linking and smaller artifacts.
  CARGO_PROFILE_DEV_DEBUG: "0"

# Literal group prefix: under workflow_call `github.workflow` is the caller's name.
concurrency:
  group: linux-x64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            automake \
            autoconf \
            libtool \
            gettext \
            autopoint \
            libxml2-dev \
            zlib1g-dev \
            openssl \
            libssl-dev \
            liblz4-dev \
            liblzma-dev \
            libclang-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 12

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          cache: true

      - name: Build GUI (.deb)
        run: |
          cd ./crates/openconnect-gui
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles deb $TAURI_PROFILE_FLAG

      - name: Build CLI
        run: |
          cargo build $CARGO_PROFILE_FLAG -p openconnect-cli

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openconnect-linux-x64
          path: |
            ./target/${{ env.BUILD_PROFILE }}/bundle/
            ./target/${{ env.BUILD_PROFILE }}/openconnect-cli
