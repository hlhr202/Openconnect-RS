name: Windows x64 Build

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ["main", "develop"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
  pull_request:
    branches: ["main", "develop"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"

# Release profile only for tags (incl. release.yml via workflow_call), `main`, and
# PRs targeting `main`. Everything on `develop` uses a fast debug build instead.
env:
  BUILD_PROFILE: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.base_ref == 'main') && 'release' || 'debug' }}
  TAURI_PROFILE_FLAG: ${{ !(startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.base_ref == 'main') && '--debug' || '' }}
  CARGO_PROFILE_FLAG: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.base_ref == 'main') && '--release' || '' }}
  # Skip debuginfo in debug builds: much faster linking and smaller artifacts.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always
  OPENCONNECT_USE_PREBUILT: "false"
  OPENCONNECT_PREBUILT_DIR: ${{ github.workspace }}/.openconnect-cache/openconnect
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

# Literal group prefix: under workflow_call `github.workflow` is the caller's name.
concurrency:
  group: windows-x64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sys: mingw64 }
    name: ${{ matrix.sys }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Prebuilt OpenConnect
        uses: actions/cache@v4
        with:
          path: .openconnect-cache
          key: openconnect-v9.12-windows-mingw64-${{ hashFiles('crates/openconnect-sys/scripts/nix.sh') }}

      - uses: msys2/setup-msys2@v2
        name: Setup MinGW64
        with:
          msystem: ${{matrix.sys}}
          update: true
          path-type: inherit
          install: >-
            git
            curl
            make
            zip
            base-devel
            mingw-w64-x86_64-toolchain
            automake
            libtool
            gettext
            gettext-devel
            autotools
            pkg-config
            openssl
            openssl-devel
            mingw-w64-x86_64-openssl
            libxml2
            libxml2-devel
            mingw-w64-x86_64-libxml2
            libiconv
            libiconv-devel
            mingw-w64-x86_64-libiconv
            zlib
            zlib-devel
            mingw-w64-x86_64-zlib
            liblz4
            liblz4-devel
            mingw-w64-x86_64-lz4
            liblzma
            liblzma-devel
            mingw-w64-x86_64-xz
            icu
            icu-devel
            mingw-w64-x86_64-icu
          pacboy: >-
            toolchain:p

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: crates/openconnect-gui/pnpm-lock.yaml

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.19.0"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-gnu
          cache: true

      - name: Build
        run: |
          rustup override set stable-x86_64-pc-windows-gnu
          cd ./crates/openconnect-gui
          pnpm install --frozen-lockfile
          pnpm tauri build $TAURI_PROFILE_FLAG

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openconnect-win
          path: ./target/${{ env.BUILD_PROFILE }}/bundle/
