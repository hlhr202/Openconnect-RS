name: Linux x64 Prebuilt OpenConnect

on:
  workflow_dispatch:
  push:
    paths:
      - "crates/openconnect-sys"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libxml2-dev zlib1g-dev openssl libssl-dev pkg-config automake autoconf libtool gettext autopoint zip

      - name: "🚧 Build TOOL"
        run: |
          git clone --branch v9.12 https://gitlab.com/openconnect/openconnect.git
          cd openconnect
          curl -O https://gitlab.com/openconnect/vpnc-scripts/raw/master/vpnc-script
          ./autogen.sh
          ./configure --enable-shared --enable-static \
            --with-openssl \
            --without-gssapi \
            --without-libproxy \
            --without-stoken \
            --without-libpcsclite \
            --without-libpskc \
            --without-gnutls \
            --with-vpnc-script=./vpnc-script
          make clean
          make
          rm -rf .git
          cd ../
          zip -r openconnect.zip openconnect

      - name: "Upload"
        uses: actions/upload-artifact@v4.3.1
        with:
          name: prebuilt-openconnect-linux-x86_64
          path: openconnect.zip
