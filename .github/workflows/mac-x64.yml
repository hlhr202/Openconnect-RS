name: Mac x64 Build

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Install Dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install libxml2 zlib openssl@3 lz4 xz pkg-config automake autoconf libtool gettext
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 12

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-apple-darwin
          cache: true

      - name: Build GUI
        run: |
          cd ./crates/openconnect-gui
          pnpm install --frozen-lockfile
          pnpm tauri build

      - name: Build CLI
        run: |
          cargo build --release -p openconnect-cli

      - name: Package DMG
        run: |
          STAGE_DIR=$(mktemp -d)
          cp -R ./target/release/bundle/macos/openconnect-gui.app "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create -volname "Openconnect GUI" \
            -srcfolder "$STAGE_DIR" \
            -ov -format UDZO \
            ./target/release/bundle/openconnect-gui_osx-x86_64.dmg
          rm -rf "$STAGE_DIR"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openconnect-mac-x64
          path: |
            ./target/release/bundle/
            ./target/release/openconnect-cli
