[package]
name = "openconnect-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
description = "A safe Rust library for interacting with OpenConnect VPN"
license = "LGPL-2.1"
repository = "https://github.com/hlhr202/Openconnect-RS/tree/main/crates/openconnect-core"
keywords = ["openconnect", "vpn", "networking", "security"]
documentation = "https://docs.rs/openconnect-core"

[features]
default = ["native"]
native = ["openconnect-sys/native"]
mock-ffi = ["openconnect-sys/mock-ffi"]

[lib]
crate-type = ["lib"]

[dependencies]
signal-hook = { workspace = true }
libc = { workspace = true }
openconnect-sys = { path = "../openconnect-sys", version = "0.3.0", default-features = false }
thiserror = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "macros"] }
home = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
machine-uid = { workspace = true }
chacha20poly1305 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }

[dev-dependencies]
dotenvy = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[example]]
name = "password_server"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-gnu"]

[lints]
workspace = true