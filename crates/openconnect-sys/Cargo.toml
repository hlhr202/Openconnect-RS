[package]
name = "openconnect-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
build = "build/main.rs"
description = "Rust bindings for OpenConnect"
license = "LGPL-2.1"
repository = "https://github.com/hlhr202/Openconnect-RS/tree/main/crates/openconnect-sys"
keywords = ["openconnect", "vpn", "networking", "security"]
documentation = "https://docs.rs/openconnect-sys"

[features]
default = ["native"]
native = ["dep:openssl-sys", "dep:bindgen", "dep:pkg-config", "dep:reqwest", "dep:zip", "dep:sha2", "dep:hex"]
mock-ffi = []

[dependencies]
openssl-sys = { version = "0.9.118", optional = true }

[lib]
crate-type = ["lib"]

[build-dependencies]
cc = "1.2"
bindgen = { version = "0.71", optional = true }
pkg-config = { version = "0.3.32", optional = true }
reqwest = { workspace = true, optional = true }
zip = { version = "2.6", default-features = false, features = ["deflate"], optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-gnu"]

[lints]
workspace = true