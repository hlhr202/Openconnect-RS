[package]
name = "openconnect-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Cross-platform OpenConnect VPN GUI client"
license = "LGPL-2.1"

[features]
default = ["native"]
native = ["openconnect-core/native"]
mock-ffi = ["openconnect-core/mock-ffi"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-shell = { workspace = true }
open = { workspace = true }
openconnect-core = { path = "../../openconnect-core", version = "0.3.0", default-features = false }
openconnect-oidc = { path = "../../openconnect-oidc", version = "0.3.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
sudo = { workspace = true }

[target.'cfg(windows)'.dependencies]
dunce = { workspace = true }

[lints]
workspace = true
