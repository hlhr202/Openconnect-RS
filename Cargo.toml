[workspace]
resolver = "3"
members = [
    "crates/openconnect-sys",
    "crates/openconnect-core",
    "crates/openconnect-gui/src-tauri",
    "crates/openconnect-cli",
    "crates/openconnect-oidc",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.90"
authors = ["hlhr202"]
homepage = "https://github.com/hlhr202/Openconnect-RS"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"

[workspace.dependencies]
reqwest = { version = "0.12.24", features = [
    "multipart",
    "blocking",
    "cookies",
] }
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
tokio = { version = "1.48" }
tokio-serde = { version = "0.9.0", features = ["json", "serde"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures = "0.3"
anyhow = "1.0"
dotenvy = "0.15.7"
thiserror = "2.0"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
security-framework = "3.5"
sudo = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
home = "0.5.12"
libc = "0.2"
dunce = "1.0.5"
chrono = "0.4"
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest"] }
url = "2.5"
sha2 = "0.10"
rand = "0.8.5"
hex = "0.4.3"
machine-uid = "0.6"
chacha20poly1305 = "0.10.1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
signal-hook = "0.4"
colored = "3"
comfy-table = "8"
dialoguer = "0.12"
open = "5"
tempfile = "3"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-build = "2.7"
tauri-plugin-os = "2.4"
tauri-plugin-shell = "2.6"
